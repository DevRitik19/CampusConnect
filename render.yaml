services:
  - type: web
    name: campusconnect-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: COLLEGE_NAME
        value: "Apex Institute of Technology"
      - key: COLLEGE_EMAIL_DOMAIN
        value: campus.edu
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
